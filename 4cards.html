<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>4 Bootstrap Cards</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>

<body>

<div class="container py-5">
  <h2 class="text-center mb-4">Our Cards</h2>

  <div class="row g-4">

    <!-- Card 1 -->
    <div class="col-12 col-md-6 col-lg-3">
      <div class="card h-100 shadow-sm">
        <img src="https://picsum.photos/400/250?random=1"
             class="card-img-top"
             alt="Card Image">

        <div class="card-body">
          <h5 class="card-title">Card One</h5>
          <p class="card-text">
            Ito ang description ng unang card.
          </p>
          <a href="#" class="btn btn-primary">Read More</a>
        </div>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="col-12 col-md-6 col-lg-3">
      <div class="card h-100 shadow-sm">
        <img src="https://picsum.photos/400/250?random=2"
             class="card-img-top"
             alt="Card Image">

        <div class="card-body">
          <h5 class="card-title">Card Two</h5>
          <p class="card-text">
            Ito ang description ng pangalawang card.
          </p>
          <a href="#" class="btn btn-success">Read More</a>
        </div>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="col-12 col-md-6 col-lg-3">
      <div class="card h-100 shadow-sm">
        <img src="https://picsum.photos/400/250?random=3"
             class="card-img-top"
             alt="Card Image">

        <div class="card-body">
          <h5 class="card-title">Card Three</h5>
          <p class="card-text">
            Ito ang description ng pangatlong card.
          </p>
          <a href="#" class="btn btn-warning">Read More</a>
        </div>
      </div>
    </div>

    <!-- Card 4 -->
    <div class="col-12 col-md-6 col-lg-3">
      <div class="card h-100 shadow-sm">
        <img src="https://picsum.photos/400/250?random=4"
             class="card-img-top"
             alt="Card Image">

        <div class="card-body">
          <h5 class="card-title">Card Four</h5>
          <p class="card-text">
            Ito ang description ng pang-apat na card.
          </p>
          <a href="#" class="btn btn-danger">Read More</a>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
