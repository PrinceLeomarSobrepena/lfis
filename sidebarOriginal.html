<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navbar Sidebar</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- font style -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Nunito', Arial, sans-serif;
    overflow-x:hidden;
    background:#f5f6fa;
}

/* ================= SIDEBAR ================= */

.sidebar{
    position:fixed;
    top:15px;
    left:15px;
    bottom:15px;
    width:250px;
    background: white;
    border:1px solid #dee2e6;
    border-radius:12px;
    padding:20px 15px;
    display:flex;
    flex-direction:column;
   transition: transform 0.7s ease-in-out;
    z-index:1050;
}

.sidebar-logo{
    text-align:center;
    margin-bottom:15px;
}

.sidebar-logo img{
    margin-top:12px;
    width:100px;
    height:100px;
    border-radius:50%;
    object-fit:cover;
      border:3px solid red;
    margin-bottom:12px;
}

.sidebar-title{
    text-align:center;
    font-weight:900 !important;
    font-size:11px;
    margin-bottom:2px;
    transform: scaleY(1.5);
    letter-spacing:.5px;
}

.sidebar-subtitle{
    text-align:center;
    font-size:11.1px;
    font-weight:600;
    letter-spacing:.5px; /*.3*/
    text-transform:uppercase;
    margin-bottom:18px;
}

.sidebar hr{
    border-color:#E7ECE9;
    margin:0 0 14px;
    opacity:1;
}

.sidebar .nav-section-label{
    font-size:10.5px;
    font-weight:700;
    color: #7C8A85;
    text-transform:uppercase;
    letter-spacing:.6px;
    padding:6px 15px 8px;
}

.sidebar a{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 14px;
    margin-bottom:4px;
    border-radius:10px;
    text-decoration:none;
    color:#4B5A54;
    font-weight:600;
    font-size:14px;
    position:relative;
    transition:.2s ease;
}

.sidebar a i{
    font-size:16px;
    width:18px;
    text-align:center;
    color:#8CA298;
    transition:.2s ease;
}

.sidebar a:hover{
    background: #E8F7EF;
    color: #198754;
}

.sidebar a:hover i{
    color: #198754;
}

.sidebar a.active{
    background:linear-gradient(135deg, #198754, #147a49);
    color:#fff;
    box-shadow:0 6px 14px rgba(25,135,84,0.25);
}

.sidebar a.active i{
    color:#fff;
}

.logout-btn{
    margin-top:auto;
    border:1px solid #ddd;
}

.logout-btn:hover{
    background:#FCEAED !important;
    color: #E1596B !important;
     border: 1px solid #E1596B;
}

.logout-btn:hover i{
    color: #E1596B !important;
}

/* =============== NAVBAR TOP =============== */
.navbar-top {
    position: fixed;
    top: 0;
    left: 290px;   /*285px SAME as navbar margin-left */
    right: 15px;   /*10px SAME as navbar margin-right */
    height: 70px;
    background: inherit;
    /* border: 1px solid #104a84; */
    border-radius: 0 0 12px 12px;
    z-index: 1010;
}

/* ================= NAVBAR ================= */

.navbar-custom{
    position: sticky;
    top:15px;
    margin-top:15px;
    margin-left:290px;
    margin-right:15px;
    background:#fff;
    border:1px solid #dee2e6;
    border-radius:12px;
    padding:16px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:1020;
}

.navbar-title{
    font-size:18px;
    font-weight: 900;
    margin:0;
}

.navbar-left{ /* alisssssssssssssssssssssssssssssssssssssssssssssssssss */
    display:flex;
    align-items:center;
    gap:10px;
}

.navbar-right{
    display:flex;
    align-items:center;
    gap:15px;
}

.icon{
    font-size:20px;
    color:#6c757d;
    cursor:pointer;
}


/* PROFILE */

.profile-img{
    width:35px;
    height:35px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #ddd;
}

/* ================= OVERLAY ================= */

#overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.3);
    backdrop-filter:blur(2px);
    opacity:0;
    visibility:hidden;
    transition:.3s;
    z-index:1040;
}

#overlay.show{
    opacity:1;
    visibility:visible;
}

/* CLOSE BUTTON */

.btn-close-outside{
    display:none;
}

/* MENU BUTTON */

.menu-toggle-btn{
    display:none;
}



/* ================= MAIN CONTENT ================= */

.main-content{
    margin-left:290px;
    margin-right:15px;
    margin-top:15px;
    padding-bottom:300px;
}

.page-heading{
    font-weight:800;
    font-size:21px;
    margin-bottom:2px;
    color: #0F1B2D;
}

.page-subheading{
    font-size:13px;
    color: #7C8A85;
    font-weight:600;
}


/* ====================== KPI ===================== */
.kpi-card{
    background: #fff;
    border:1px solid #E7ECE9;
    border-radius:14px;
    padding:18px 20px;
    box-shadow:0 4px 20px rgba(20,60,40,0.04);
    height:100%;
    transition:.2s ease;
}

.kpi-card:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 26px rgba(20,60,40,0.08);
}

.kpi-icon{
    width:42px;
    height:42px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
}

.kpi-value{
    font-size:26px;
    font-weight:800;
    letter-spacing:-.5px;
    margin:12px 0 2px;
}

.kpi-label{
    font-size:12.5px;
    color:#7C8A85;
    font-weight:700;
}

.kpi-delta{
    font-size:11.5px;
    font-weight:700;
    padding:3px 8px;
    border-radius:20px;
    display:inline-flex;
    align-items:center;
    gap:4px;
    margin-top:10px;
}



/* ================= MOBILE ================= */

@media(max-width:992px){

    .sidebar{
        top:0px;
        left:0px;
        bottom:0px;
        width:300px;
        border-radius:0;
        transform:translateX(-200%);
    }

    .sidebar.show{
        transform:translateX(0);
    }

    /*pag active yung sidebar at pinalakihan at pinaliitan mo mawawala yung x sa sidebar***********************************************************/
    .sidebar .btn-close-outside {
        display: none;
    }

    .navbar-top{
        display: none;
    }

    .navbar-custom{
        margin:0;
        border-radius:0;
        top:0;
        border-left:none;
        border-right:none;
    }

    .main-content{
        margin-left:15px;
    }

    .menu-toggle-btn{
        display:block;
    }

    .btn-close-outside{
        position:absolute;
        top:10px;
        right:-50px;
        width:40px;
        height:40px;
        border-radius:50%;
        background:#fff;
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
        box-shadow:0 5px 15px rgba(0,0,0,0.2);
    }

    .sidebar.show .btn-close-outside{
        display:flex;
    }

}

</style>
</head>
<body>

    <a href="#" class="logout-btn"> <i class="bi bi-box-arrow-right"></i> Logout </a>
</div>

<!-- NAVBAR -->
<nav class="navbar-custom shadow-sm">
    <div class="navbar-left">
        <img src="https://picsum.photos/200" class="profile-img d-lg-none">

    <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mt-4 mb-3">
        <div>
            <div class="page-heading">Welcome back, Admin 👋</div>

</div>

<script>

function toggleSidebar(){
    document.getElementById("sidebar")
    .classList.toggle("show");

    document.getElementById("overlay")
    .classList.toggle("show");
}

/* CLOSE WHEN CLICK OVERLAY */

document.getElementById("overlay")
.addEventListener("click", function(){
    document.getElementById("sidebar")
    .classList.remove("show");

    this.classList.remove("show");
});

/* FIX RESIZE */

window.addEventListener("resize", ()=>{

    if(window.innerWidth >= 992){
        document.getElementById("sidebar")
        .classList.remove("show");

        document.getElementById("overlay")
        .classList.remove("show");
    }
});

</script>

</body>
