<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

     <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
                body{
            background:#f4f6f9;
        }
               .item-card{
           
            transition:.3s;
        }
                .item-card:hover{
            transform:translateY(-3px);
            box-shadow:0 .75rem 1.5rem rgba(0,0,0,.12)!important;
        }

                .label{
            /* font-size:.75rem; */
            color:#6c757d;
            font-weight:600;
            display:block;
            margin-bottom:2px;
        }
        .bi{
            font-weight:900 !important;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="container py-4">

        <h3 class="section-title mb-4">
            Lost and Found Items
        </h3>

        <div class="row">
            <div class="col-12 mb-3">
                <div class="card item-card border-0 h-100 shadow-sm">
                    <div class="card-body">
                        <!-- Sample Data Row -->
                        <div class="row align-items-center text-center py-1">
                            
                            <!-- IMAGE -->
                            <div class="col">
                                <img src="uploads/default.jpg"  class="img-thumbnail"  alt="Item" height="80" width="80" style="object-fit: cover;">
                            </div>

                            <!-- STATUS -->
                            <div class="col">
                                <span class="label">
                                    <i class="bi bi-check-circle"></i>
                                    Status
                                </span>

                                <span class="badge bg-dark">
                                    Found
                                </span>
                            </div>

                             <!-- CATEGORY -->
                            <div class="col">
                                <span class="label">
                                   <i class="bi bi-ui-checks-grid"></i>
                                    Category
                                </span>

                                <div class="value">
                                    Electronics
                                </div>
                            </div>

                            <!-- ITEM DETAILS -->
                            <div class="col">
                                <span class="label">
                                    <i class="bi bi-tag"></i>
                                    Item Details
                                </span>

                                <div class="value">
                                    Cash : 30.00
                                </div>
                            </div>

                            <!-- REPORT LOCATION -->
                            <div class="col">
                                <span class="label">
                                   <i class="bi bi-geo-alt"></i>
                                    Reported Location
                                </span>

                                <div class="value">
                                     Room 303
                                </div>
                            </div>

                             <!-- CLAIM STATUS -->
                            <div class="col">
                                <span class="label">
                                    <i class="bi bi-person-check"></i>
                                    Claim Status
                                </span>

                                <span class="badge bg-success">
                                    Claimed
                                </span>
                            </div>

                            <!--CREATED AT -->
                            <div class="col">
                                <span class="label">
                                     <i class="bi bi-calendar"></i>
                                    Created At
                                </span>

                                <div class="value">
                                    July 11, 2026
                                </div>
                            </div>

                            <div class="col">
                                <button class="btn btn-primary btn-sm">
                                    View
                                </button>
                                <button class="btn btn-success btn-sm">
                                    Claim
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- extra -->
            <div class="col-12 mb-4">
                <div class="card item-card border-0 h-100 shadow-sm">
                    <div class="card-body">
                        <!-- Sample Data Row -->
                        <div class="row align-items-center text-center py-1">
                            
                            <!-- IMAGE -->
                            <div class="col">
                                <img src="uploads/default.jpg"  class="img-thumbnail"  alt="Item" height="80" width="80" style="object-fit: cover;">
                            </div>

                            <!-- STATUS -->
                            <div class="col">
                                <span class="label">
                                    <i class="bi bi-check-circle"></i>
                                    Status
                                </span>

                                <span class="badge bg-dark">
                                    Found
                                </span>
                            </div>

                             <!-- CATEGORY -->
                            <div class="col">
                                <span class="label">
                                   <i class="bi bi-ui-checks-grid"></i>
                                    Category
                                </span>

                                <div class="value">
                                    Electronics
                                </div>
                            </div>

                            <!-- ITEM DETAILS -->
                            <div class="col">
                                <span class="label">
                                    <i class="bi bi-tag"></i>
                                    Item Details
                                </span>

                                <div class="value">
                                    Cash : 30.00
                                </div>
                            </div>

                            <!-- REPORT LOCATION -->
                            <div class="col">
                                <span class="label">
                                   <i class="bi bi-geo-alt"></i>
                                    Reported Location
                                </span>

                                <div class="value">
                                     Room 303
                                </div>
                            </div>

                             <!-- CLAIM STATUS -->
                            <div class="col">
                                <span class="label">
                                    <i class="bi bi-person-check"></i>
                                    Claim Status
                                </span>

                                <span class="badge bg-success">
                                    Claimed
                                </span>
                            </div>

                            <!--CREATED AT -->
                            <div class="col">
                                <span class="label">
                                     <i class="bi bi-calendar"></i>
                                    Created At
                                </span>

                                <div class="value">
                                    July 11, 2026
                                </div>
                            </div>

                            <div class="col">
                                <button class="btn btn-primary btn-sm">
                                    View
                                </button>
                                <button class="btn btn-success btn-sm">
                                    Claim
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
