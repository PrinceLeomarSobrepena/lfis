<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
    <div class="card shadow p-4">
        <h4 class="mb-4">Select Item Type</h4>

        <form>

            <div class="mb-3">
                <label class="form-label">Item Type</label>
                <select class="form-select" onchange="showFields(this)" required>
                    <option value="" selected disabled>Select Type</option>
                    <option value="cash">Cash</option>
                    <option value="gadget">Gadget</option>
                    <option value="document">Document</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div id="dynamicFields"></div>

        </form>
    </div>
</div>

<script>
function showFields(select) {

    let html = "";
    const container = document.getElementById("dynamicFields");

    switch(select.value){

        case "cash":
            html = `
                <div class="mb-3">
                    <label class="form-label">Amount</label>
                    <input type="number" class="form-control" name="amount" placeholder="Enter Amount">
                </div>
            `;
            break;

        case "gadget":
            html = `
                <div class="mb-3">
                    <label class="form-label">Brand / Model</label>
                    <input type="text" class="form-control" name="brand" placeholder="Brand / Model">
                </div>

                <div class="mb-3">
                    <label class="form-label">Color</label>
                    <input type="text" class="form-control" name="color" placeholder="Color">
                </div>

                <div class="mb-3">
                    <label class="form-label">Unique Features</label>
                    <input type="text" class="form-control" name="features" placeholder="Unique Features">
                </div>
            `;
            break;

        case "document":
            html = `
                <div class="mb-3">
                    <label class="form-label">Document Type</label>
                    <input type="text" class="form-control" name="doctype" placeholder="ID, Passport, Certificate">
                </div>

                <div class="mb-3">
                    <label class="form-label">Name on Document</label>
                    <input type="text" class="form-control" name="docname" placeholder="Name on Document">
                </div>
            `;
            break;

        case "other":
            html = `
                <div class="mb-3">
                    <label class="form-label">Item Description</label>
                    <textarea class="form-control" rows="3" name="description" placeholder="Describe the item"></textarea>
                </div>
            `;
            break;

        default:
            html = "";
    }

    container.innerHTML = html;
}
</script>

</body>
</html>
