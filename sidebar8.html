<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- font style -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Nunito', Arial, sans-serif;
    overflow-x:hidden;
    background:#f5f6fa;
}

/* ================= SIDEBAR ================= */
.sidebar{
    position:fixed;
    top:15px;
    left:15px;
    bottom:15px;
    width:250px;
    background: white;
    border:1px solid #dee2e6;
    border-radius:12px;
    padding:20px 15px;
    display:flex;
    flex-direction:column;
   transition: transform 0.7s ease-in-out;
    z-index:1050;
}

.sidebar-logo{
    text-align:center;
    margin-bottom:15px;
}

.sidebar-logo img{
    margin-top:12px;
    width:100px;
    height:100px;
    border-radius:50%;
    object-fit:cover;
      border:3px solid red;
    margin-bottom:12px;
}

.sidebar-title{
    text-align:center;
    font-weight:900 !important;
    font-size:11px;
    margin-bottom:2px;
    transform: scaleY(1.5);
    letter-spacing:.5px;
}

.sidebar-subtitle{
    text-align:center;
    font-size:11.1px;
    font-weight:600;
    letter-spacing:.5px; /*.3*/
    text-transform:uppercase;
    margin-bottom:18px;
}

.sidebar hr{
    border-color:#E7ECE9;
    margin:0 0 14px;
    opacity:1;
}

.sidebar .nav-section-label{
    font-size:10.5px;
    font-weight:700;
    color: #7C8A85;
    text-transform:uppercase;
    letter-spacing:.6px;
    padding:6px 15px 8px;
}

.sidebar a{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 14px;
    margin-bottom:4px;
    border-radius:10px;
    text-decoration:none;
    color:#4B5A54;
    font-weight:600;
    font-size:14px;
    position:relative;
    transition:.2s ease;
}

.sidebar a i{
    font-size:16px;
    width:18px;
    text-align:center;
    color:#8CA298;
    transition:.2s ease;
}

.sidebar a:hover{
    background: #E8F7EF;
    color: #198754;
}

.sidebar a:hover i{
    color: #198754;
}

.sidebar a.active{
    background:linear-gradient(135deg, #198754, #147a49);
    color:#fff;
    box-shadow:0 6px 14px rgba(25,135,84,0.25);
}

.sidebar a.active i{
    color:#fff;
}

.logout-btn{
    margin-top:auto;
    border:1px solid #ddd;
}

.logout-btn:hover{
    background:#FCEAED !important;
    color: #E1596B !important;
     border: 1px solid #E1596B;
}

.logout-btn:hover i{
    color: #E1596B !important;
}

/* ================= NAVBAR ================= */
.navbar-custom{
    position: sticky;
    /* top:15px; */
    margin-top:15px;
    margin-left:290px;
    margin-right:15px;
    background:#fff;
    border:1px solid #dee2e6;
    border-radius:12px;
    padding:16px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:1020;
}

.navbar-title{
    font-size:18px;
    font-weight: 900;
    margin:0;
}

.navbar-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.navbar-right{
    display:flex;
    align-items:center;
    gap:15px;
}

.icon{
    font-size:20px;
    color:#6c757d;
    cursor:pointer;
}

/* PROFILE */

.profile-img{
    width:35px;
    height:35px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #ddd;
}

/* ================= OVERLAY ================= */
#overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.3);
    backdrop-filter:blur(2px);
    opacity:0;
    visibility:hidden;
    transition:.3s;
    z-index:1040;
}

#overlay.show{
    opacity:1;
    visibility:visible;
}

/* CLOSE BUTTON */

.btn-close-outside{
    display:none;
}

/* MENU BUTTON */

.menu-toggle-btn{
    display:none;
}

/* ================= MAIN CONTENT ================= */
.main-content{
    margin-left:290px;
    margin-right:15px;
    margin-top:15px;
    padding-bottom:30px;
}

.page-heading{
    font-weight:800;
    font-size:21px;
    margin-bottom:2px;
    color: #0F1B2D;
}

.page-subheading{
    font-size:13px;
    color: #7C8A85;
    font-weight:600;
}

/* ====================== CHANGE PASSWORD CARD ===================== */
.form-card{
    background: #fff;
    border:1px solid #E7ECE9;
    border-radius:14px;
    padding:28px 30px;
    box-shadow:0 4px 20px rgba(20,60,40,0.04);
    max-width:520px;
}

.form-card label{
    font-size:13px;
    font-weight:700;
    color:#4B5A54;
    margin-bottom:6px;
}

.form-card .form-control{
    border-radius:10px;
    border:1px solid #dee2e6;
    padding:10px 14px;
    font-size:14px;
}

.form-card .form-control:focus{
    border-color:#198754;
    box-shadow:0 0 0 .2rem rgba(25,135,84,0.15);
}

.pw-wrapper{
    position:relative;
}

.pw-toggle{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    color:#8CA298;
    cursor:pointer;
    font-size:14px;
}

.pw-hint{
    font-size:11.5px;
    color:#7C8A85;
    font-weight:600;
    margin-top:6px;
}

.btn-save-pw{
    background:linear-gradient(135deg, #198754, #147a49);
    color:#fff;
    border:none;
    border-radius:10px;
    font-weight:700;
    font-size:13.5px;
    padding:11px 22px;
}

.btn-save-pw:hover{
    color:#fff;
    opacity:.92;
}

.btn-cancel-pw{
    border-radius:10px;
    font-weight:700;
    font-size:13.5px;
    padding:11px 22px;
    border:1px solid #ddd;
    color:#4B5A54;
}

/* ================= MOBILE ================= */
@media(max-width:992px){

    .sidebar{
        top:0px;
        left:0px;
        bottom:0px;
        width:300px;
        border-radius:0;
        transform:translateX(-200%);
    }

    .sidebar.show{
        transform:translateX(0);
    }

    .sidebar .btn-close-outside {
        display: none;
    }

    .navbar-custom{
        margin:0;
        border-radius:0;
        top:0;
        border-left:none;
        border-right:none;
    }

    .main-content{
        margin-left:15px;
    }

    .menu-toggle-btn{
        display:block;
    }

    .btn-close-outside{
        position:absolute;
        top:10px;
        right:-50px;
        width:40px;
        height:40px;
        border-radius:50%;
        background:#fff;
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
        box-shadow:0 5px 15px rgba(0,0,0,0.2);
    }

    .sidebar.show .btn-close-outside{
        display:flex;
    }

}

</style>
</head>
<body>

<!-- OVERLAY -->
<div id="overlay"></div>

<!-- SIDEBAR -->
<div class="sidebar shadow-sm" id="sidebar">
    <div class="btn-close-outside" onclick="toggleSidebar()">
        <i class="fas fa-times" style="margin-left: -1px;"></i>
    </div>

    <hr>

    <div class="nav-section-label">Main</div>
    <a href="#"> <i class="bi bi-speedometer2"></i> Dashboard </a>
    <a href="#"> <i class="bi bi-people"></i> Staff </a>

    <a href="#"> <i class="bi bi-plus-lg"></i> Create </a>
    <a href="#"> <i class="bi bi-journal-text"></i> List </a>
    <a href="#"> <i class="bi bi-layers"></i> Match Items </a>
    <a href="#"> <i class="bi bi-search"></i> Found Items </a>
    <a href="#"> <i class="bi bi-clipboard-data"></i> Audit Trail </a>
    <a href="#"> <i class="bi bi-graph-up-arrow"></i> Statistic </a>
    <div class="nav-section-label">Other</div>  
    <a href="#"> <i class="bi bi-calendar-event"></i> Calendar </a>
    <a href="#" class="active"> <i class="bi bi-lock" style="display: inline-block; transform: scaleX(1.4);"></i> Change Password </a>
    <a href="#" class="logout-btn"> <i class="bi bi-box-arrow-right"></i> Logout </a>
</div>

<!-- NAVBAR -->
<nav class="navbar-custom shadow-sm">
    <div class="navbar-left">
        <img src="https://picsum.photos/200" class="profile-img d-lg-none">

        <h5 class="navbar-title text-success" style="font-family:'Nunito', Arial, sans-serif;">
            Lost And Found Information System
        </h5>
    </div>

    <div class="navbar-right">
        <i class="fa-solid fa-bars icon menu-toggle-btn" onclick="toggleSidebar()"></i>
    </div>
</nav>

<!-- MAIN CONTENT -->
<div class="main-content">

    <div class="mt-4 mb-3">
        <div class="page-heading">Change Password</div>
        <div class="page-subheading">Update your account password to keep your account secure.</div>
    </div>

    <div class="form-card">
        <form id="changePasswordForm">

            <div class="mb-3">
                <label for="currentPassword" class="form-label">Current Password</label>
                <div class="pw-wrapper">
                    <input type="password" class="form-control" id="currentPassword" placeholder="Enter current password" required>
                    <i class="bi bi-eye pw-toggle" onclick="togglePw('currentPassword', this)"></i>
                </div>
            </div>

            <div class="mb-3">
                <label for="newPassword" class="form-label">New Password</label>
                <div class="pw-wrapper">
                    <input type="password" class="form-control" id="newPassword" placeholder="Enter new password" required>
                    <i class="bi bi-eye pw-toggle" onclick="togglePw('newPassword', this)"></i>
                </div>
                <div class="pw-hint">Must be at least 8 characters, with a number and a special character.</div>
            </div>

            <div class="mb-4">
                <label for="confirmPassword" class="form-label">Confirm New Password</label>
                <div class="pw-wrapper">
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter new password" required>
                    <i class="bi bi-eye pw-toggle" onclick="togglePw('confirmPassword', this)"></i>
                </div>
                <div class="pw-hint" id="matchMsg"></div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-save-pw"><i class="bi bi-check-lg"></i> Save Changes</button>
                <button type="button" class="btn btn-cancel-pw">Cancel</button>
            </div>

        </form>
    </div>

</div>

<script>

function toggleSidebar(){
    document.getElementById("sidebar")
    .classList.toggle("show");

    document.getElementById("overlay")
    .classList.toggle("show");
}

/* CLOSE WHEN CLICK OVERLAY */

document.getElementById("overlay")
.addEventListener("click", function(){
    document.getElementById("sidebar")
    .classList.remove("show");

    this.classList.remove("show");
});

/* FIX RESIZE */

window.addEventListener("resize", ()=>{

    if(window.innerWidth >= 992){
        document.getElementById("sidebar")
        .classList.remove("show");

        document.getElementById("overlay")
        .classList.remove("show");
    }
});

/* SHOW/HIDE PASSWORD */

function togglePw(id, icon){
    const input = document.getElementById(id);
    if(input.type === "password"){
        input.type = "text";
        icon.classList.remove("bi-eye");
        icon.classList.add("bi-eye-slash");
    } else {
        input.type = "password";
        icon.classList.remove("bi-eye-slash");
        icon.classList.add("bi-eye");
    }
}

/* MATCH CHECK + SUBMIT */

const form = document.getElementById("changePasswordForm");
const newPw = document.getElementById("newPassword");
const confirmPw = document.getElementById("confirmPassword");
const matchMsg = document.getElementById("matchMsg");

confirmPw.addEventListener("input", ()=>{
    if(confirmPw.value === ""){
        matchMsg.textContent = "";
        return;
    }
    if(newPw.value === confirmPw.value){
        matchMsg.textContent = "Passwords match.";
        matchMsg.style.color = "#198754";
    } else {
        matchMsg.textContent = "Passwords do not match.";
        matchMsg.style.color = "#E1596B";
    }
});

form.addEventListener("submit", function(e){
    e.preventDefault();
    if(newPw.value !== confirmPw.value){
        matchMsg.textContent = "Passwords do not match.";
        matchMsg.style.color = "#E1596B";
        return;
    }
    alert("Password changed successfully.");
    form.reset();
    matchMsg.textContent = "";
});

</script>

</body>
</html>
