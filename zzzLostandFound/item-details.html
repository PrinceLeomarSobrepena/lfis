<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brown Wallet — Item Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root {
    --navy: #2E7D53;
    --navy-deep: #1F5D3D;
    --cream: #F4F4F3;
    --paper: #FFFFFF;
    --brass: #3B8F63;
    --brass-dark: #276B49;
    --ink: #232322;
    --ink-soft: #6B6B69;
    --hairline: #E2E2E0;
    --sage: #E5F3EA;
    --sage-ink: #276B49;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 48px 20px;
    background: var(--cream);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
  }

  .container { width: 100%; max-width: 860px; }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--brass-dark);
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }

  .eyebrow::before {
    content: "";
    width: 22px;
    height: 1px;
    background: var(--brass-dark);
  }

  .eyebrow a { color: var(--brass-dark); text-decoration: none; }
  .eyebrow a:hover { color: var(--navy); }

  .layout {
    display: grid;
    grid-template-columns: 1fr 1.15fr;
    gap: 36px;
    align-items: start;
  }

  .item-photo {
    background: var(--sage);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    overflow: hidden;
    aspect-ratio: 4 / 3.4;
  }

  .item-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .item-title {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 30px;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin: 0 0 16px;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--sage);
    color: var(--sage-ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 3px;
    margin-bottom: 24px;
  }

  .status-badge svg { width: 12px; height: 12px; stroke: var(--sage-ink); }

  .meta-list {
    list-style: none;
    margin: 0 0 22px;
    padding: 0;
    display: flex;
    flex-direction: column;
  }

  .meta-list li {
    display: flex;
    gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid var(--hairline);
    font-size: 15px;
  }

  .meta-list li:first-child { padding-top: 0; }

  .meta-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--brass-dark);
    width: 110px;
    flex-shrink: 0;
    padding-top: 2px;
  }

  .meta-value { color: var(--ink); }

  .description {
    font-size: 15px;
    line-height: 1.65;
    color: var(--ink-soft);
    margin: 0 0 28px;
  }

  .claim-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--navy);
    color: var(--cream);
    text-decoration: none;
    padding: 14px 24px;
    border-radius: 4px;
    font-size: 15px;
    font-weight: 500;
    transition: background 0.15s ease;
  }

  .claim-btn svg { width: 16px; height: 16px; stroke: var(--brass); }
  .claim-btn:hover { background: var(--navy-deep); }

  @media (max-width: 680px) {
    .layout { grid-template-columns: 1fr; }
    .item-title { font-size: 26px; }
  }
</style>
</head>
<body>

<div class="container">
  <p class="eyebrow"><a href="found-items.html">Found items</a> / Item details</p>

  <div class="layout">
    <div class="item-photo">
      <img src="images/wallet.jpg" alt="Brown wallet">
    </div>

    <div class="item-info">
      <h2 class="item-title">Brown wallet</h2>

      <span class="status-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"/></svg>
        Found
      </span>

      <ul class="meta-list">
        <li>
          <span class="meta-label">Location</span>
          <span class="meta-value">Cafeteria</span>
        </li>
        <li>
          <span class="meta-label">Date found</span>
          <span class="meta-value">May 25, 2026</span>
        </li>
      </ul>

      <p class="description">Brown leather wallet with school ID.</p>

      <a href="claim-process.html" class="claim-btn">
        How to claim
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
