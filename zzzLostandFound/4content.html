<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stats Card</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .stats-card {
            background: #fff;
            border: 0;
            border-radius: 14px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.07);
            overflow: hidden;
        }

        .stats-row {
            display: flex;
            width: 100%;
        }

        .stat-item {
            flex: 1;
            min-width: 0;
            padding: 20px;
            text-align: center;
            border-right: 1px solid #eee;
        }

        .stat-item:last-child {
            border-right: 0;
        }

        .stat-label {
            font-size: 14px;
            color: #777;
            margin-bottom: 6px;
            white-space: nowrap;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #222;
            white-space: nowrap;
        }

        .stat-sub {
            font-size: 12px;
            color: #999;
            margin-top: 3px;
            white-space: nowrap;
        }

        /* MOBILE */
        @media (max-width: 576px) {
            .stats-card {
                border-radius: 10px;
            }

            .stat-item {
                padding: 12px 5px;
            }

            .stat-label {
                font-size: 11px;
                margin-bottom: 3px;
            }

            .stat-value {
                font-size: 16px;
            }

            .stat-sub {
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

<div class="container-fluid px-3 py-4">

    <div class="stats-card">

        <div class="stats-row">

            <div class="stat-item">
                <div class="stat-label">Items Found</div>
                <div class="stat-value">96</div>
                <div class="stat-sub">Total items</div>
            </div>

            <div class="stat-item">
                <div class="stat-label">Matched</div>
                <div class="stat-value">68%</div>
                <div class="stat-sub">Successfully matched</div>
            </div>

            <div class="stat-item">
                <div class="stat-label">Match Rate</div>
                <div class="stat-value">68%</div>
                <div class="stat-sub">Overall rate</div>
            </div>

            <div class="stat-item">
                <div class="stat-label">Avg. Return</div>
                <div class="stat-value">2.1 days</div>
                <div class="stat-sub">Average return</div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
